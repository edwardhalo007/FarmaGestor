# docker-compose.yml (Na raiz do projeto)
services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=farmagestor_db
      - POSTGRES_USER=farmacia_user
      - POSTGRES_PASSWORD=senha_segura_producao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia_user -d farmagestor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend      # <--- APONTA PARA A PASTA BACKEND
      dockerfile: Dockerfile
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=sua_chave_secreta_aqui
      # Note que o host do banco é 'db'
      - DATABASE_URL=postgres://farmacia_user:senha_segura_producao@db:5432/farmagestor_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,seuservidor.prefeitura.gov.br
      - CORS_ALLOWED_ORIGINS=http://localhost,http://seuservidor.prefeitura.gov.br
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://seuservidor.prefeitura.gov.br
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend     # <--- APONTA PARA A PASTA FRONTEND
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: